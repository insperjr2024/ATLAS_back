services:
  - type: web
    name: atlas-back
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # As migrations rodam ANTES do uvicorn. Sem isto, o deploy sobe código
    # que espera colunas que o banco não tem, e o app morre no primeiro SELECT
    # com "column does not exist".
    #
    # No `startCommand` e não no `preDeployCommand` porque aquele exige plano
    # pago. O custo é rodar a cada reinício — barato, porque `upgrade head` não
    # faz nada quando o banco já está em dia.
    #
    # ⚠ Se a migration falhar, o app NÃO sobe. É de propósito: servir com o
    # esquema errado é pior que ficar fora do ar, e o erro aparece no log do
    # deploy em vez de virar 500 para o usuário.
    startCommand: alembic upgrade head && uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://atlasijr.vercel.app
