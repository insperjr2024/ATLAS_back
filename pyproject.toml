[project]
name = "bancas-back"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.0",
    "bcrypt>=4.2.1",
    # Geração dos documentos jurídicos (§ Contratos): docxtpl preenche os
    # templates .docx, num2words escreve valor/prazo por extenso.
    "docxtpl>=0.20.2",
    "fastapi>=0.139.2",
    "num2words>=0.5.14",
    # Leitura posicional do calendário acadêmico em PDF (utils/calendario_pdf.py).
    "pdfplumber>=0.11.10",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
